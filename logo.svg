<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">

  <rect width="600" height="220" rx="16" fill="#0f172a"/>

  <!-- Tricolor -->
  <rect x="120" y="55" width="18" height="80" fill="#0057B8"/>
  <rect x="155" y="55" width="18" height="80" fill="#FCD116"/>
  <rect x="190" y="55" width="18" height="80" fill="#CE1126"/>

  <!-- MDSI -->
  <text x="230" y="136"
        font-family="Arial, Helvetica, sans-serif"
        font-size="92"
        font-weight="700"
        fill="#ffffff">
    MDSI
  </text>

  <!-- Linie -->
  <line x1="80" y1="165" x2="520" y2="165"
        stroke="#cbd5e1"
        stroke-width="2"/>

  <!-- Slogan -->
  <text x="300" y="198"
        text-anchor="middle"
