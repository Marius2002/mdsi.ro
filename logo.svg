<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180">

  <rect width="600" height="180" rx="16" fill="#0f172a"/>

  <!-- Tricolor -->
  <rect x="130" y="52" width="18" height="78" fill="#0057B8"/>
  <rect x="165" y="52" width="18" height="78" fill="#FCD116"/>
  <rect x="200" y="52" width="18" height="78" fill="#CE1126"/>

  <!-- MDSI -->
  <text x="235" y="130"
        font-family="Arial, Helvetica, sans-serif"
        font-size="92"
        font-weight="700"
        fill="#ffffff">
    MDSI
  </text>

  <!-- Linie -->
  <line x1="80" y1="152" x2="520" y2="152"
        stroke="#cbd5e1"
        stroke-width="2"/>

  <!-- Slogan -->
  <text x="300" y="175"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        fill="#cbd5e1">
    Operational Support &amp; Transport Services
  </text>

</svg>
